name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check

  package-smoke:
    name: Packed CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # The documented install: the packed release tarball, installed globally.
      - name: Install the packed CLI globally and run it
        run: |
          tarball=$(npm pack --silent --pack-destination "$RUNNER_TEMP")
          npm install -g --prefix "$RUNNER_TEMP/global" "$RUNNER_TEMP/$tarball" --no-audit --no-fund
          export PATH="$RUNNER_TEMP/global/bin:$PATH"
          test -f "$RUNNER_TEMP/global/lib/node_modules/agenticseo/.agents/skills/seo-audit/SKILL.md"
          mkdir "$RUNNER_TEMP/site" && cd "$RUNNER_TEMP/site"
          agenticseo init --domain example.com --location US
          agenticseo context > /dev/null

  core-checks:
    name: Core checks
    needs: [check, package-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        run: |
          [ "${{ needs.check.result }}" = "success" ]
          [ "${{ needs.package-smoke.result }}" = "success" ]
