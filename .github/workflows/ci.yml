name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check

  package-smoke:
    name: Packed CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build
      - name: Install tarball and run the CLI
        run: |
          tarball=$(npm pack --silent --pack-destination "$RUNNER_TEMP")
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP/$tarball" --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/agenticseo init --domain example.com --location 2840 --language en
          test -f .agenticseo/project.json

  core-checks:
    name: Core checks
    needs: [check, package-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        run: |
          [ "${{ needs.check.result }}" = "success" ]
          [ "${{ needs.package-smoke.result }}" = "success" ]
